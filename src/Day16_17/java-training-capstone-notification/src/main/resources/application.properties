spring.application.name=java-training-capstone-notification
server.port=8082

# Kafka Common Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Properties
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.java_training_capstone_notification.inDTO.OrderNotificationInDTO
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Logging Configuration
logging.level.com.example.java_training_capstone_notification=INFO
logging.level.org.apache.kafka=WARN

# Application graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

