server.port=8080

# GCP Configuration for Emulators
gcp.project-id=test-project
gcp.bucket-name=test-bucket
gcp.pubsub.topic=new-topic

# Disable Spring Cloud GCP auto-configuration
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.storage.enabled=false
spring.cloud.gcp.pubsub.enabled=false

# Logging
logging.level.com.example.pub_sub=DEBUG
logging.level.com.google.cloud=DEBUG
logging.level.com.google.api.gax=DEBUG

# Multipart configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
gcp.storage.emulator-host=http://localhost:4443
gcp.pubsub.emulator-host=http://localhost:8085